<div id="suits-easter-egg">
  <div class="egg-modal">
    <button class="egg-close">&times;</button>
    <div class="suits-container">
      <div class="character-group harvey">
        <img id="harvey-avatar" alt="Harvey" class="avatar-img">
        <div class="dialog-box left-arrow">
          I'm inclined to give you a shot, but what if I decide to go another way?
        </div>
      </div>
      <div class="character-group mike">
        <div class="dialog-box right-arrow">
          I'd say that's fair. Sometimes I like to hang out with people who aren't that bright, you know, just to see how the other half lives.
        </div>
        <img id="mike-avatar" alt="Mike" class="avatar-img">
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const suitsEgg = document.getElementById('suits-easter-egg');

  // 核心修复：强制将彩蛋弹窗移出带有 transform 动画的父节点，置于 body 根层级
  // 防止 position: fixed 降级为 absolute 导致整个弹窗基于正文向右偏移
  if (suitsEgg && suitsEgg.parentElement !== document.body) {
    document.body.appendChild(suitsEgg);
  }

  // 使用 Quarto 自带的 offset 处理不同嵌套层级页面的图像路径引用
  const offset = (function() {
    const metas = document.getElementsByTagName("meta");
    for (let i = 0; i < metas.length; i++) {
      if (metas[i].getAttribute("name") === "quarto:offset") {
        return metas[i].getAttribute("content");
      }
    }
    return "";
  })();
  
  document.getElementById('harvey-avatar').src = offset + 'effect/fig/Harvey.png';
  document.getElementById('mike-avatar').src = offset + 'effect/fig/Mike.png';

  // 将关闭按钮的逻辑也移到JS中，更清晰
  const closeBtn = suitsEgg.querySelector('.egg-close');
  const closeEggModal = () => {
    suitsEgg.style.display = 'none';
  };

  if (closeBtn) {
    closeBtn.addEventListener('click', closeEggModal);
  }

  // 点击遮罩层(虚化背景)时自动关闭弹窗，提升手机端体验
  suitsEgg.addEventListener('click', (e) => {
    // 确保点击的是遮罩层本身，而不是弹窗内部的内容
    if (e.target === suitsEgg) {
      closeEggModal();
    }
  });

  // 彩蛋触发逻辑
  const logo = document.querySelector('.navbar-brand');
  let clickTimer = null;
  
  if (logo) {
    logo.addEventListener('click', (e) => {
      // 1. 如果弹窗已经显示，则阻止所有点击行为，防止刷新或触发其他效果
      if (window.getComputedStyle(suitsEgg).display !== 'none') {
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }

      e.preventDefault();
      
      let clickCount = parseInt(sessionStorage.getItem('eggClickCount') || '0');
      clickCount++;
      sessionStorage.setItem('eggClickCount', clickCount);
      
      if (clickTimer) clearTimeout(clickTimer);
      
      if (clickCount >= 7) {
        // 动态获取 Navbar 的实际高度与层级 (z-index)，彻底与硬编码解绑
        const targetNav = document.querySelector('.fixed-top') || document.querySelector('.navbar');
        if (targetNav) {
          // 1. 获取实时渲染的高/宽度尺寸
          const navHeight = targetNav.getBoundingClientRect().height + 'px';
          suitsEgg.style.top = navHeight;
          suitsEgg.style.height = `calc(100% - ${navHeight})`;
          
          // 2. 获取实时计算出的 z-index，并使其始终低于导航栏 1 个层级
          const navZIndex = parseInt(window.getComputedStyle(targetNav).zIndex, 10);
          if (!isNaN(navZIndex)) suitsEgg.style.zIndex = navZIndex - 1;
        }

        suitsEgg.style.display = 'flex';
        sessionStorage.setItem('eggClickCount', 0); // 触发后清零
      } else {
        // 如果400毫秒内没有继续点击，仅重置点击次数，不触发强制刷新页面（避免与下雪开关冲突）
        clickTimer = setTimeout(() => {
          const currentCount = parseInt(sessionStorage.getItem('eggClickCount') || '0');
          if (currentCount === clickCount && currentCount < 7) {
            sessionStorage.setItem('eggClickCount', 0);
          }
        }, 400); 
      }
    });
  }
});
</script>
