<style>
  #suits-easter-egg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .egg-modal {
    background-color: var(--bs-body-bg, #fff);
    color: var(--bs-body-color, #212529);
    border: 2px solid var(--bs-border-color, #dee2e6);
    padding: clamp(15px, 3vw, 30px);
    position: relative;
    max-width: 95vw;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  html[data-bs-theme="dark"] .egg-modal,
  body.quarto-dark .egg-modal {
    background-color: #2b2b2b !important;
    border-color: #7b8a8b !important;
  }

  .egg-close {
    position: absolute;
    top: 5px;
    right: 10px;
    background: transparent;
    border: none;
    font-size: 24px;
    font-weight: bold;
    color: var(--bs-body-color, #212529);
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .egg-close:hover {
    opacity: 1;
  }

  .suits-container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap; /* Allow wrapping on small screens */
    justify-content: space-evenly; /* Distribute space to reduce large gaps on sides */
    align-items: center;
    gap: clamp(20px, 4vw, 40px);
  }

  .character-group {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
  }

  .avatar-img {
    width: clamp(80px, 12vw, 150px);
    height: clamp(80px, 12vw, 150px);
    object-fit: cover;
    border: 2px solid var(--bs-border-color, #dee2e6);
    background-color: var(--bs-body-bg, #fff);
  }

  .dialog-box {
    background-color: var(--bs-body-bg, #fff);
    color: var(--bs-body-color); /* Explicitly set text color for robustness */
    border: 2px solid var(--bs-border-color, #dee2e6);
    padding: clamp(10px, 2vw, 20px);
    font-family: inherit;
    text-transform: uppercase;
    font-weight: bold;
    font-size: clamp(0.75rem, 1.5vw, 1.1rem);
    max-width: 65vw; /* 宽度随屏幕动态调整 */
    border-radius: 0;
    position: relative;
    line-height: 1.4;
  }

  .dialog-box.left-arrow {
    margin-left: 15px;
  }
  .dialog-box.left-arrow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -14px;
    transform: translateY(-50%);
    border-width: 10px 14px 10px 0;
    border-style: solid;
    border-color: transparent var(--bs-border-color, #dee2e6) transparent transparent;
  }
  .dialog-box.left-arrow::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -10px;
    transform: translateY(-50%);
    border-width: 8px 11px 8px 0;
    border-style: solid;
    border-color: transparent var(--bs-body-bg, #fff) transparent transparent;
  }

  .dialog-box.right-arrow {
    margin-right: 15px;
  }
  .dialog-box.right-arrow::before {
    content: '';
    position: absolute;
    top: 50%;
    right: -14px;
    transform: translateY(-50%);
    border-width: 10px 0 10px 14px;
    border-style: solid;
    border-color: transparent transparent transparent var(--bs-border-color, #dee2e6);
  }
  .dialog-box.right-arrow::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -10px;
    transform: translateY(-50%);
    border-width: 8px 0 8px 11px;
    border-style: solid;
    border-color: transparent transparent transparent var(--bs-body-bg, #fff);
  }

  /* ===== 🌙 Dark mode explicit overrides for Dialog ===== */
  html[data-bs-theme="dark"] .dialog-box,
  body.quarto-dark .dialog-box {
    background-color: #2b2b2b !important;
    color: #e0e0e0 !important;
    border-color: #555555 !important;
  }

  html[data-bs-theme="dark"] .dialog-box.left-arrow::before,
  body.quarto-dark .dialog-box.left-arrow::before {
    border-right-color: #555555 !important;
  }
  html[data-bs-theme="dark"] .dialog-box.left-arrow::after,
  body.quarto-dark .dialog-box.left-arrow::after {
    border-right-color: #2b2b2b !important;
  }

  html[data-bs-theme="dark"] .dialog-box.right-arrow::before,
  body.quarto-dark .dialog-box.right-arrow::before {
    border-left-color: #555555 !important;
  }
  html[data-bs-theme="dark"] .dialog-box.right-arrow::after,
  body.quarto-dark .dialog-box.right-arrow::after {
    border-left-color: #2b2b2b !important;
  }
</style>

<div id="suits-easter-egg">
  <div class="egg-modal">
    <button class="egg-close">&times;</button>
    <div class="suits-container">
      <div class="character-group harvey">
        <img id="harvey-avatar" alt="Harvey" class="avatar-img">
        <div class="dialog-box left-arrow">
          I'm inclined to give you a shot, but what if I decide to go another way?
        </div>
      </div>
      <div class="character-group mike">
        <div class="dialog-box right-arrow">
          I'd say that's fair. Sometimes I like to hang out with people who aren't that bright, you know, just to see how the other half lives.
        </div>
        <img id="mike-avatar" alt="Mike" class="avatar-img">
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const suitsEgg = document.getElementById('suits-easter-egg');

  // 使用 Quarto 自带的 offset 处理不同嵌套层级页面的图像路径引用
  const offset = (function() {
    const metas = document.getElementsByTagName("meta");
    for (let i = 0; i < metas.length; i++) {
      if (metas[i].getAttribute("name") === "quarto:offset") {
        return metas[i].getAttribute("content");
      }
    }
    return "";
  })();
  
  document.getElementById('harvey-avatar').src = offset + 'effect/fig/Harvey.png';
  document.getElementById('mike-avatar').src = offset + 'effect/fig/Mike.png';

  // 将关闭按钮的逻辑也移到JS中，更清晰
  const closeBtn = suitsEgg.querySelector('.egg-close');
  const closeEggModal = () => {
    suitsEgg.style.display = 'none';
  };

  if (closeBtn) {
    closeBtn.addEventListener('click', closeEggModal);
  }

  // 点击遮罩层(虚化背景)时自动关闭弹窗，提升手机端体验
  suitsEgg.addEventListener('click', (e) => {
    // 确保点击的是遮罩层本身，而不是弹窗内部的内容
    if (e.target === suitsEgg) {
      closeEggModal();
    }
  });

  // 彩蛋触发逻辑
  const logo = document.querySelector('.navbar-brand');
  let clickTimer = null;
  
  if (logo) {
    logo.addEventListener('click', (e) => {
      // 1. 如果弹窗已经显示，则阻止所有点击行为，防止刷新或触发其他效果
      if (window.getComputedStyle(suitsEgg).display !== 'none') {
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }

      e.preventDefault();
      
      let clickCount = parseInt(sessionStorage.getItem('eggClickCount') || '0');
      clickCount++;
      sessionStorage.setItem('eggClickCount', clickCount);
      
      if (clickTimer) clearTimeout(clickTimer);
      
      if (clickCount >= 7) {
        suitsEgg.style.display = 'flex';
        sessionStorage.setItem('eggClickCount', 0); // 触发后清零
      } else {
        // 如果400毫秒内没有继续点击，且尚未达到阈值，判定为正常跳转需求
        clickTimer = setTimeout(() => {
          const currentCount = parseInt(sessionStorage.getItem('eggClickCount') || '0');
          if (currentCount === clickCount && currentCount < 7) {
            sessionStorage.setItem('eggClickCount', 0);
            window.location.href = logo.getAttribute('href') || '/';
          }
        }, 400); 
      }
    });
  }
});
</script>
